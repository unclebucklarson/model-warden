name: Security audit

# Known-vulnerability check over the dependency tree (RustSec advisory
# DB): weekly, on any dependency change, and on demand. Findings open
# issues rather than failing unrelated CI.

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
