name: Security audit

# Known-vulnerability check over the dependency tree (RustSec advisory
# DB): weekly, on any dependency change, and on demand. Runs cargo-audit
# directly — no third-party action, no Node runtime to deprecate.
# Ignored advisories live in .cargo/audit.toml, each with its reason.

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
