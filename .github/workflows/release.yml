name: Release

# Tag a version (git tag v0.1.0 && git push origin v0.1.0) and this builds
# release binaries, packages them with the docs and licenses, and publishes
# a GitHub Release with the tarball + checksum attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "x86_64-unknown-linux-gnu"
          - os: macos-latest
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build and package each target
        shell: bash
        run: |
          mkdir -p dist
          for TARGET in ${{ matrix.targets }}; do
            rustup target add "$TARGET"
            cargo build --release --locked --target "$TARGET"
            NAME="modelwarden-${GITHUB_REF_NAME}-${TARGET}"
            mkdir -p "dist/${NAME}/docs"
            cp "target/${TARGET}/release/warden" "target/${TARGET}/release/warden-gui" "dist/${NAME}/"
            cp README.md LICENSE-MIT LICENSE-APACHE "dist/${NAME}/"
            cp docs/users-guide.md "dist/${NAME}/docs/"
            tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
            (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
