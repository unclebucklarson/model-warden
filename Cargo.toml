[package]
name = "modelwarden"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Inventory, backup, and archival for local LLM model files — GGUFs and safetensors directories across Ollama, HF cache, shelves, and removable drives"
license = "MIT OR Apache-2.0"
authors = ["Scott Larson"]
repository = "https://github.com/unclebucklarson/model-warden"
readme = "README.md"
keywords = ["llm", "gguf", "ollama", "huggingface", "backup"]
categories = ["command-line-utilities", "filesystem"]
default-run = "warden-gui"

# The GUI and its native dependencies are a feature so library consumers
# (modellab, 2026-09-01) can depend on the core with
# `default-features = false` and never compile egui.
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "warden-gui"
path = "src/bin/warden-gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
# Pinned to the harvest source (llamacppCodeConf) so the GUI shell pattern
# compiles unchanged.
eframe = { version = "=0.36.1", optional = true }
env_logger = "0.11.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

# Lock liveness probe: kill(pid, 0) on every unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Hashing 300 GiB is CPU-bound; unoptimized sha2 runs ~10x slower than the
# 680 MB/s the spike measured. Optimize the hash path even in dev builds so
# `cargo run -- hash` is usable during development.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3

# Defaults ship ~9 MB of debug symbols in every release tarball and every
# `cargo install`, with no LTO and codegen-units=16 on paths that are
# genuinely CPU-bound (GGUF header parsing, JSON serialisation, SHA-256).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
