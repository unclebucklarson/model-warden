[package]
name = "modelwarden"
version = "0.1.0"
edition = "2024"
default-run = "warden-gui"

[dependencies]
anyhow = "1"
# Pinned to the harvest source (llamacppCodeConf) so the GUI shell pattern
# compiles unchanged.
eframe = "=0.36.1"
env_logger = "0.11.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
